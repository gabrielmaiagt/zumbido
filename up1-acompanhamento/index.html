<style>
  :root{
    --maroon:#2a1410;
    --creme:#f2e7d1;
    --ouro:#d8bc79;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--maroon);
    color:var(--creme);
    line-height:1.4;

  /* Barra URGENTE (topo, largura total) */
  .urgente-bar{
    width:100%;
    background:linear-gradient(90deg,#ffffff 0%,#f6e3bf 38%,#ef9f36 100%);
    text-align:center;
    padding:18px 16px;
  }
  .urgente-bar span{
    color:#000;
    font-weight:900;
    text-decoration:underline;
    text-underline-offset:4px;
    font-size:clamp(34px,9vw,50px);
    letter-spacing:.5px;
  }

  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:26px 22px 40px;
  }

  /* Aviso */
  .aviso{
    text-align:center;
    color:var(--creme);
    font-weight:800;
    font-size:clamp(19px,5.2vw,25px);
    line-height:1.35;
  }
  .aviso u{text-underline-offset:3px}

  /* Progresso */
  .passo{
    color:var(--ouro);
    font-weight:800;
    font-size:clamp(14px,3.8vw,16px);
    margin:28px 0 8px;
  }
  .progress{
    background:#ededed;
    border-radius:40px;
    height:clamp(36px,9vw,46px);
    overflow:hidden;
  }
  .progress .fill{
    width:66%;
    height:100%;
    background:linear-gradient(180deg,#ecd4a6,#dcbc84);
    border-radius:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#4a3517;
    font-weight:800;
    font-size:clamp(14px,3.8vw,16px);
  }

  /* Bem vindo */
  .bemvindo{
    text-align:center;
    color:var(--ouro);
    font-weight:800;
    font-size:clamp(26px,7vw,36px);
    line-height:1.25;
    margin:30px 0 6px;
  }
  .bemvindo u{text-underline-offset:4px}

  /* Área da VSL (VTurb) */
  .vsl{margin-top:22px}
  .vsl-placeholder{
    border:2px dashed rgba(216,188,121,.4);
    border-radius:10px;
    min-height:clamp(240px,56vw,360px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
    color:var(--ouro);
    font-weight:800;
    font-size:clamp(16px,4.5vw,20px);
  }
  .vsl-placeholder span{font-size:14px;opacity:.7}

  /* ===== VTURB: elementos revelados no tempo do pitch ===== */
  .esconder{display:none}
  .oferta{margin-top:30px}
  .oferta-garantia{
    text-align:center;font-size:clamp(13px,3.6vw,15px);
    opacity:.7;margin-top:20px;line-height:1.5;
  }

  /* ===== BOTÕES DO GERADOR DE UPSELL DA CAKTO =====
     A Cakto renderiza o botão dentro de Shadow DOM,
     por isso a estilização usa ::part(button). */
  cakto-upsell-buttons{display:block;width:100%}
  cakto-upsell-accept,
  cakto-upsell-reject{display:block;width:100%}

  cakto-upsell-accept::part(button){
    display:block;width:100%;box-sizing:border-box;
    background:linear-gradient(180deg,#22A745,#1c8f3b);
    color:#fff;text-transform:uppercase;font-weight:900;
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:clamp(16px,4.4vw,20px);line-height:1.3;
    padding:24px 18px;border-radius:14px;border:none;
    margin-top:22px;cursor:pointer;
    box-shadow:0 8px 22px rgba(34,167,69,.32);
    transition:filter .12s ease, transform .1s ease;
  }
  cakto-upsell-accept::part(button):hover{filter:brightness(1.06)}
  cakto-upsell-accept::part(button):active{transform:scale(.99)}

  cakto-upsell-reject::part(button){
    display:block;width:100%;box-sizing:border-box;
    background:transparent;border:none;
    color:rgba(242,231,209,.5);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:clamp(14px,3.7vw,16px);font-weight:600;
    text-decoration:underline;text-underline-offset:3px;
    margin-top:18px;padding:10px;cursor:pointer;
  }
  cakto-upsell-reject::part(button):hover{color:rgba(242,231,209,.85)}

  .btn-sim{
    display:block;width:100%;box-sizing:border-box;
    background:linear-gradient(180deg,#22A745,#1c8f3b);
    color:#fff;text-transform:uppercase;font-weight:900;
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:clamp(16px,4.4vw,20px);line-height:1.3;
    padding:24px 18px;border-radius:14px;border:none;
    margin-top:22px;cursor:pointer;
    box-shadow:0 8px 22px rgba(34,167,69,.32);
    transition:filter .12s ease, transform .1s ease;
    text-decoration:none;text-align:center;
  }
  .btn-sim:hover{filter:brightness(1.06)}
  .btn-sim:active{transform:scale(.99)}

  .btn-nao{
    display:block;width:100%;box-sizing:border-box;
    background:transparent;border:none;
    color:rgba(242,231,209,.5);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:clamp(14px,3.7vw,16px);font-weight:600;
    text-decoration:underline;text-underline-offset:3px;
    margin-top:18px;padding:10px;cursor:pointer;
    text-align:center;
  }
  .btn-nao:hover{color:rgba(242,231,209,.85)}
</style>
